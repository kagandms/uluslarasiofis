<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <style>
        body { font-family: Arial, sans-serif; width: 300px; padding: 10px; }
        button { width: 100%; padding: 10px; margin: 5px 0; cursor: pointer; background: #0056b3; color: white; border: none; border-radius: 4px; }
        button:hover { background: #004494; }
        .input-group { margin: 10px 0; }
        input { width: 93%; padding: 8px; margin-top: 5px; border: 1px solid #ccc; border-radius: 4px; }
        #status-message { margin-top: 10px; font-size: 12px; color: green; font-weight: bold; text-align: center; }
    </style>
</head>
<body>
    <h3 style="margin-top: 0;">YÖKSİS Otomasyonu</h3>
    
    <button id="btn-copy">1. Diğer Verileri Kopyala (Topkapı)</button>
    
    <hr style="margin:15px 0;">
    
    <div class="input-group">
        <label style="font-size: 12px; font-weight: bold;">Kabul ID:</label>
        <input type="text" id="kabul-id-input" placeholder="Örn: 23A-90C-F5" style="text-transform: uppercase;">
    </div>
    <button id="btn-search">2. Kabul ID ile Sorgula (YÖKSİS)</button>
    
    <hr style="margin:15px 0;">

    <button id="btn-fill">3. Kalan Bilgileri Doldur (YÖKSİS)</button>
    
    <div id="status-message">Bekleniyor...</div>

    <script src="popup.js"></script>
</body>
</html>
