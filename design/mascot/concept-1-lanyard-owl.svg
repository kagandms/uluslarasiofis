<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" class="mascot-svg mascot-owl" aria-hidden="true" focusable="false">
  <title>Puhu — Lanyard Owl Office Mascot</title>
  <style>
    .mascot-owl {
      --m-primary: var(--public-burgundy, #7e1830);
      --m-primary-light: var(--public-burgundy-light, #9a203d);
      --m-outline: var(--mascot-outline, var(--public-burgundy-hover, #641126));
      --m-soft: var(--public-burgundy-soft, #fbf2f4);
      --m-border: var(--public-burgundy-border, #e2c0c8);
      --m-feather: var(--mascot-feather, #ead8de);
      --m-wing: var(--mascot-wing, #d7bcc5);
      --m-surface: var(--mascot-surface, #fff9fa);
      --m-card: var(--mascot-card, #ffffff);
      --m-ink: var(--mascot-ink, #241b22);
      --m-accent: var(--mascot-accent, #d89b27);
    }
    .mascot-owl #state-thinking,
    .mascot-owl #state-handoff {
      display: none;
    }
    .mascot-owl.is-thinking #state-idle,
    .mascot-owl.is-thinking #state-handoff {
      display: none;
    }
    .mascot-owl.is-thinking #state-thinking {
      display: inline;
    }
    .mascot-owl.is-handoff #state-idle,
    .mascot-owl.is-handoff #state-thinking {
      display: none;
    }
    .mascot-owl.is-handoff #state-handoff {
      display: inline;
    }
    .mascot-owl .owl-dot {
      animation: owlDotPulse 1.35s ease-in-out infinite;
    }
    .mascot-owl .owl-dot-2 { animation-delay: 0.2s; }
    .mascot-owl .owl-dot-3 { animation-delay: 0.4s; }
    @keyframes owlDotPulse {
      0%, 80%, 100% { opacity: 0.3; }
      40% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      .mascot-owl .owl-dot {
        animation: none;
        opacity: 1;
      }
    }
  </style>

  <!-- Shared owl body, facial discs, beak and office lanyard -->
  <g class="owl-base">
    <!-- Tiny neat feet -->
    <ellipse cx="25" cy="56" rx="3.1" ry="1.8" fill="var(--m-accent)" stroke="var(--m-outline)" stroke-width="1.6"/>
    <ellipse cx="39" cy="56" rx="3.1" ry="1.8" fill="var(--m-accent)" stroke="var(--m-outline)" stroke-width="1.6"/>

    <!-- Plump owl silhouette with soft ear tufts (no graduation cap) -->
    <path d="M18.5 16.5 C15.8 11.2, 20.8 9.2, 24.8 13 C28.2 11.4, 35.8 11.4, 39.2 13 C43.2 9.2, 48.2 11.2, 45.5 16.5 C49.2 20.5, 51 27.5, 51 35 C51 47.2, 43 55.2, 32 55.2 C21 55.2, 13 47.2, 13 35 C13 27.5, 14.8 20.5, 18.5 16.5 Z" fill="var(--m-feather)" stroke="var(--m-outline)" stroke-width="2.4" stroke-linejoin="round"/>

    <!-- Bright facial discs and cream belly for high contrast on light, dark and burgundy -->
    <ellipse cx="32" cy="44" rx="11.8" ry="8.8" fill="var(--m-surface)"/>
    <circle cx="25.2" cy="26.8" r="7.4" fill="var(--m-surface)"/>
    <circle cx="38.8" cy="26.8" r="7.4" fill="var(--m-surface)"/>
    <path d="M23.5 19.8 Q32 23.8 40.5 19.8" fill="none" stroke="var(--m-outline)" stroke-width="1.9" stroke-linecap="round"/>

    <!-- Warm amber beak -->
    <path d="M29.2 29.6 Q32 28.1 34.8 29.6 L32 33.6 Z" fill="var(--m-accent)" stroke="var(--m-outline)" stroke-width="1.5" stroke-linejoin="round"/>

    <!-- Burgundy office lanyard ribbon and blank ID card -->
    <path d="M21.2 35.6 L32 42.6 L42.8 35.6" fill="none" stroke="var(--m-primary)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="30.2" y="41.2" width="3.6" height="2.6" rx="1" fill="var(--m-outline)"/>
    <rect x="25.2" y="43.6" width="13.6" height="9.2" rx="2" fill="var(--m-card)" stroke="var(--m-primary)" stroke-width="1.8"/>
    <rect x="26.5" y="44.8" width="11" height="2.4" rx="0.8" fill="var(--m-primary)"/>
    <line x1="27.5" y1="49.2" x2="36.5" y2="49.2" stroke="var(--m-border)" stroke-width="1.4" stroke-linecap="round"/>
    <line x1="27.5" y1="51.2" x2="33.5" y2="51.2" stroke="var(--m-border)" stroke-width="1.4" stroke-linecap="round"/>
  </g>

  <!-- State 1: Idle (default) -->
  <g id="state-idle">
    <path d="M14 31.2 C9.2 34.8, 9.8 44, 15.8 46.8 C16.6 41.8, 16.3 35.8, 14 31.2 Z" fill="var(--m-wing)" stroke="var(--m-outline)" stroke-width="2.2" stroke-linejoin="round"/>
    <path d="M50 31.2 C54.8 34.8, 54.2 44, 48.2 46.8 C47.4 41.8, 47.7 35.8, 50 31.2 Z" fill="var(--m-wing)" stroke="var(--m-outline)" stroke-width="2.2" stroke-linejoin="round"/>
    <circle cx="25.2" cy="26.8" r="2.8" fill="var(--m-ink)"/>
    <circle cx="38.8" cy="26.8" r="2.8" fill="var(--m-ink)"/>
    <circle cx="26.2" cy="25.8" r="0.95" fill="#ffffff"/>
    <circle cx="39.8" cy="25.8" r="0.95" fill="#ffffff"/>
  </g>

  <!-- State 2: Thinking -->
  <g id="state-thinking">
    <path d="M14 31.2 C9.2 34.8, 9.8 44, 15.8 46.8 C16.6 41.8, 16.3 35.8, 14 31.2 Z" fill="var(--m-wing)" stroke="var(--m-outline)" stroke-width="2.2" stroke-linejoin="round"/>
    <path d="M49.8 31.5 C55.2 33, 55.6 39.2, 49.4 42.8 C46.4 44.4, 43.8 42, 45.8 39 C47.2 36.8, 48.5 34.2, 49.8 31.5 Z" fill="var(--m-wing)" stroke="var(--m-outline)" stroke-width="2.2" stroke-linejoin="round"/>
    <circle cx="26.1" cy="25.5" r="2.7" fill="var(--m-ink)"/>
    <circle cx="39.7" cy="25.5" r="2.7" fill="var(--m-ink)"/>
    <circle cx="27" cy="24.6" r="0.9" fill="#ffffff"/>
    <circle cx="40.6" cy="24.6" r="0.9" fill="#ffffff"/>
    <rect x="41.5" y="3" width="19" height="9.6" rx="4.8" fill="var(--m-card)" stroke="var(--m-primary)" stroke-width="1.8"/>
    <circle class="owl-dot owl-dot-1" cx="46.6" cy="7.8" r="1.5" fill="var(--m-primary)"/>
    <circle class="owl-dot owl-dot-2" cx="51" cy="7.8" r="1.5" fill="var(--m-primary)"/>
    <circle class="owl-dot owl-dot-3" cx="55.4" cy="7.8" r="1.5" fill="var(--m-primary)"/>
  </g>

  <!-- State 3: Handoff (wing pointing down toward question form below) -->
  <g id="state-handoff">
    <path d="M14 31.2 C9.2 34.8, 9.8 44, 15.8 46.8 C16.6 41.8, 16.3 35.8, 14 31.2 Z" fill="var(--m-wing)" stroke="var(--m-outline)" stroke-width="2.2" stroke-linejoin="round"/>
    <path d="M49.4 32 C55.6 35.4, 57.8 43.2, 54.4 51.2 L51.4 54.2 L48.4 49.8 C49.4 45.2, 49 40, 47.4 36 Z" fill="var(--m-wing)" stroke="var(--m-outline)" stroke-width="2.2" stroke-linejoin="round"/>
    <circle cx="51.6" cy="56.2" r="5.4" fill="var(--m-card)" stroke="var(--m-primary)" stroke-width="1.8"/>
    <path d="M49.1 55.1 L51.6 57.9 L54.1 55.1" fill="none" stroke="var(--m-primary)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="25.2" cy="28.2" r="2.7" fill="var(--m-ink)"/>
    <circle cx="38.8" cy="28.2" r="2.7" fill="var(--m-ink)"/>
    <circle cx="26.1" cy="27.3" r="0.9" fill="#ffffff"/>
    <circle cx="39.7" cy="27.3" r="0.9" fill="#ffffff"/>
  </g>
</svg>
