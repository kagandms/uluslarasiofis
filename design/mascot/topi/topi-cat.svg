<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" class="mascot-svg mascot-cat" aria-hidden="true" focusable="false">
<title>Topi</title>
<style>.mascot-cat{--p:var(--public-burgundy,#7e1830);--pl:var(--public-burgundy-light,#9a203d);--o:var(--mascot-outline,var(--public-burgundy-hover,#641126));--s:var(--public-burgundy-soft,#fbf2f4);--b:var(--public-burgundy-border,#e2c0c8);--c:var(--mascot-coat,#f6efe9);--m:var(--mascot-mark,#c7bec2);--sf:var(--mascot-surface,#fffbf8);--cd:var(--mascot-card,#fff);--i:var(--mascot-ink,#241b22);--a:var(--mascot-accent,#d89b27)}.mascot-cat .st{display:none}.mascot-cat #state-idle,.mascot-cat.is-thinking #state-thinking,.mascot-cat.is-understood #state-understood,.mascot-cat.is-handoff #state-handoff,.mascot-cat.is-checking #state-checking,.mascot-cat.is-confused #state-confused,.mascot-cat.is-sleepy #state-sleepy,.mascot-cat.is-sleepy .t-ts{display:inline}.mascot-cat.is-thinking #state-idle,.mascot-cat.is-understood #state-idle,.mascot-cat.is-handoff #state-idle,.mascot-cat.is-checking #state-idle,.mascot-cat.is-confused #state-idle,.mascot-cat.is-sleepy #state-idle,.mascot-cat.is-confused .t-hs,.mascot-cat.is-sleepy .t-hs,.mascot-cat.is-sleepy .t-tl{display:none}.mascot-cat .so{fill:var(--sf);stroke:var(--o);stroke-width:2;stroke-linejoin:round}.mascot-cat .cp{fill:var(--cd);stroke:var(--p);stroke-width:1.7}.mascot-cat .ik{fill:none;stroke:var(--i);stroke-linecap:round;stroke-linejoin:round}.mascot-cat .ps{fill:none;stroke:var(--p);stroke-linecap:round;stroke-linejoin:round}.mascot-cat .tb{transform-origin:32px 27px;animation:tBlink 5.4s ease-in-out infinite}.mascot-cat.is-thinking .t-tl{transform-origin:17.5px 52.5px;animation:tSway 2.2s ease-in-out infinite}.mascot-cat .td{animation:tDot 1.35s ease-in-out infinite}.mascot-cat .td2{animation-delay:.2s}.mascot-cat .td3{animation-delay:.4s}@keyframes tBlink{0%,91%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}@keyframes tSway{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(9deg)}}@keyframes tDot{0%,80%,100%{opacity:.3}40%{opacity:1}}@media(prefers-reduced-motion:reduce){.mascot-cat .tb,.mascot-cat.is-thinkin