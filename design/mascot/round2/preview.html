<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Uluslararası Ofis Asistanı — Mascot Concepts (Round 2)</title>
  <style>
    :root {
      --public-burgundy: #7e1830;
      --public-burgundy-hover: #641126;
      --public-burgundy-light: #9a203d;
      --public-burgundy-soft: #fbf2f4;
      --public-burgundy-border: #e2c0c8;
      --public-burgundy-shadow: rgba(126, 24, 48, 0.24);

      --page-bg: #f6f7f9;
      --page-surface: #ffffff;
      --page-surface-alt: #f8f9fb;
      --page-border: #e2e6ee;
      --page-text: #20232a;
      --page-muted: #59616d;
      --chat-log-bg: #fcfcfd;
      --notice-bg: #f8f9fb;
      --notice-text: #4a5260;

      --mascot-outline: #641126;
      --mascot-plumage: #5d7296;
      --mascot-wing: #758bb0;
      --mascot-coat: #f6efe9;
      --mascot-mark: #c7bec2;
      --mascot-stone: #f6eef0;
      --mascot-glow: #fff6ea;
      --mascot-surface: #fff9fa;
      --mascot-card: #ffffff;
      --mascot-ink: #241b22;
      --mascot-accent: #d89b27;

      color-scheme: light;
      font-family: Inter, "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body.is-dark {
      --public-burgundy: #b52c4d;
      --public-burgundy-hover: #96223e;
      --public-burgundy-light: #cf3d60;
      --public-burgundy-soft: #2e1921;
      --public-burgundy-border: #6c3645;
      --public-burgundy-shadow: rgba(0, 0, 0, 0.45);

      --page-bg: #11141b;
      --page-surface: #1a1f2a;
      --page-surface-alt: #212736;
      --page-border: #2f3748;
      --page-text: #eef1f6;
      --page-muted: #a6b0c2;
      --chat-log-bg: #161a24;
      --notice-bg: #1f2432;
      --notice-text: #b8c2d4;

      --mascot-outline: #4a1524;
      --mascot-plumage: #6a81a8;
      --mascot-wing: #8299bf;
      --mascot-coat: #f3ebe4;
      --mascot-mark: #c1b7bc;
      --mascot-stone: #f4eaed;
      --mascot-glow: #fff5e6;
      --mascot-surface: #f7eef1;
      --mascot-card: #ffffff;
      --mascot-ink: #1d151b;
      --mascot-accent: #e0a532;

      color-scheme: dark;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-width: 320px;
      background: var(--page-bg);
      color: var(--page-text);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    body.is-reduced-motion *,
    body.is-reduced-motion svg * {
      animation: none !important;
      transition: none !important;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 50;
      border-bottom: 1px solid var(--page-border);
      background: var(--page-surface);
    }

    .topbar-inner {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem 1rem;
      max-width: 1180px;
      margin: 0 auto;
      padding: 0.85rem 1rem;
    }

    .brand-head h1 {
      margin: 0;
      font-size: 1.1rem;
      line-height: 1.25;
      color: var(--public-burgundy);
    }

    .brand-head p {
      margin: 0.15rem 0 0;
      font-size: 0.8rem;
      color: var(--page-muted);
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.5rem;
    }

    .control-group {
      display: inline-flex;
      padding: 0.2rem;
      border: 1px solid var(--page-border);
      border-radius: 0.6rem;
      background: var(--page-surface-alt);
      gap: 0.2rem;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.35rem;
      min-height: 2.15rem;
      padding: 0.35rem 0.75rem;
      border: 1px solid var(--page-border);
      border-radius: 0.5rem;
      background: var(--page-surface);
      color: var(--page-text);
      font: inherit;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
    }

    .control-group .btn {
      border-color: transparent;
      background: transparent;
    }

    .btn[aria-pressed="true"],
    .control-group .btn[aria-pressed="true"] {
      border-color: var(--public-burgundy);
      background: var(--public-burgundy);
      color: #ffffff;
    }

    .btn:focus-visible {
      outline: 2px solid var(--public-burgundy);
      outline-offset: 2px;
    }

    main {
      max-width: 1180px;
      margin: 0 auto;
      padding: 1.25rem 1rem 3rem;
      display: grid;
      gap: 1.75rem;
    }

    .concept-card {
      border: 1px solid var(--page-border);
      border-top: 4px solid var(--public-burgundy);
      border-radius: 1rem;
      background: var(--page-surface);
      padding: 1.25rem;
      display: grid;
      gap: 1.25rem;
    }

    .concept-card.is-reference {
      border-top-style: dashed;
    }

    .concept-head {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      justify-content: space-between;
      gap: 0.4rem 1rem;
      border-bottom: 1px solid var(--page-border);
      padding-bottom: 0.85rem;
    }

    .concept-head h2 {
      margin: 0;
      font-size: 1.25rem;
      color: var(--public-burgundy);
    }

    .concept-file {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 0.78rem;
      padding: 0.18rem 0.5rem;
      border-radius: 999px;
      border: 1px solid var(--public-burgundy-border);
      background: var(--public-burgundy-soft);
      color: var(--public-burgundy);
    }

    .concept-caption {
      margin: 0.35rem 0 0;
      color: var(--page-muted);
      font-size: 0.92rem;
      flex-basis: 100%;
    }

    .section-label {
      margin: 0 0 0.6rem;
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--page-muted);
    }

    /* Quick 4-Way Comparison Strip */
    .compare-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 0.85rem;
    }

    .compare-tile {
      border: 1px solid var(--page-border);
      border-radius: 0.85rem;
      background: var(--page-surface-alt);
      padding: 0.85rem;
      display: grid;
      gap: 0.65rem;
      text-align: center;
      min-width: 0;
    }

    .compare-tile h3 {
      margin: 0;
      font-size: 0.92rem;
      color: var(--page-text);
    }

    .compare-tile .compare-sub {
      margin: 0;
      font-size: 0.75rem;
      color: var(--page-muted);
    }

    .compare-swatches {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 0.4rem;
    }

    .swatch {
      border-radius: 0.55rem;
      padding: 0.5rem 0.25rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.35rem;
      min-width: 0;
    }

    .swatch-light {
      background: #ffffff;
      border: 1px solid #d9dde5;
    }

    .swatch-dark {
      --public-burgundy: #c6395c;
      --public-burgundy-hover: #9f2745;
      --public-burgundy-light: #dc5073;
      --public-burgundy-soft: #311a23;
      --public-burgundy-border: #783c4d;
      --mascot-outline: #431320;
      --mascot-plumage: #6e85ad;
      --mascot-wing: #869dc4;
      --mascot-coat: #f4ece5;
      --mascot-mark: #c4babf;
      --mascot-stone: #f5ebee;
      --mascot-glow: #fff5e6;
      --mascot-surface: #f8eff2;
      --mascot-card: #ffffff;
      --mascot-ink: #1e161c;
      --mascot-accent: #e5a934;
      background: #161922;
      border: 1px solid #2f3748;
    }

    .swatch-burgundy {
      --public-burgundy: #7e1830;
      --public-burgundy-hover: #641126;
      --public-burgundy-light: #9a203d;
      --public-burgundy-soft: #fbf2f4;
      --public-burgundy-border: #e2c0c8;
      --mascot-outline: #521020;
      background: linear-gradient(135deg, #7e1830 0%, #9a203d 100%);
      border: 1px solid #7e1830;
    }

    /* Light & Dark Surface Matrix */
    .surface-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 1rem;
    }

    .surface-panel {
      border-radius: 0.85rem;
      padding: 0.95rem;
      display: grid;
      gap: 0.75rem;
      min-width: 0;
    }

    .surface-light {
      --public-burgundy: #7e1830;
      --public-burgundy-hover: #641126;
      --public-burgundy-light: #9a203d;
      --public-burgundy-soft: #fbf2f4;
      --public-burgundy-border: #e2c0c8;
      --mascot-outline: #641126;
      --mascot-plumage: #5d7296;
      --mascot-wing: #758bb0;
      --mascot-coat: #f6efe9;
      --mascot-mark: #c7bec2;
      --mascot-stone: #f6eef0;
      --mascot-glow: #fff6ea;
      --mascot-surface: #fff9fa;
      --mascot-card: #ffffff;
      --mascot-ink: #241b22;
      --mascot-accent: #d89b27;
      background: #ffffff;
      color: #20232a;
      border: 1px solid #d9dde5;
    }

    .surface-dark {
      --public-burgundy: #c6395c;
      --public-burgundy-hover: #9f2745;
      --public-burgundy-light: #dc5073;
      --public-burgundy-soft: #311a23;
      --public-burgundy-border: #783c4d;
      --mascot-outline: #431320;
      --mascot-plumage: #6e85ad;
      --mascot-wing: #869dc4;
      --mascot-coat: #f4ece5;
      --mascot-mark: #c4babf;
      --mascot-stone: #f5ebee;
      --mascot-glow: #fff5e6;
      --mascot-surface: #f8eff2;
      --mascot-card: #ffffff;
      --mascot-ink: #1e161c;
      --mascot-accent: #e5a934;
      background: #161922;
      color: #eef1f6;
      border: 1px solid #2f3748;
    }

    .surface-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.82rem;
      font-weight: 700;
    }

    .surface-title span:last-child {
      font-weight: 500;
      opacity: 0.72;
      font-size: 0.75rem;
    }

    .state-row {
      display: grid;
      gap: 0.45rem;
      padding-top: 0.65rem;
      border-top: 1px solid rgba(128, 136, 154, 0.22);
    }

    .state-row-label {
      font-size: 0.75rem;
      font-weight: 700;
      opacity: 0.8;
    }

    .size-strip {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-end;
      gap: 0.75rem 1rem;
    }

    .size-cell {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      gap: 0.25rem;
    }

    .size-cell code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 0.7rem;
      opacity: 0.72;
    }

    .mascot-slot {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .mascot-slot svg,
    .mascot-slot img {
      display: block;
      width: 100%;
      height: 100%;
    }

    .ref-note {
      margin: 0;
      padding: 0.55rem 0.75rem;
      border-radius: 0.55rem;
      border: 1px solid var(--public-burgundy-border);
      background: var(--public-burgundy-soft);
      color: var(--page-text);
      font-size: 0.8rem;
    }

    /* Real Widget Context Mockups */
    .widget-grid {
      display: grid;
      grid-template-columns: minmax(0, 0.85fr) minmax(0, 1.15fr);
      gap: 1rem;
      align-items: start;
    }

    .mock-box {
      border: 1px solid var(--page-border);
      border-radius: 0.85rem;
      background: var(--page-surface-alt);
      padding: 0.95rem;
      display: grid;
      gap: 0.85rem;
      min-width: 0;
    }

    .launcher-samples {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.9rem;
    }

    .mock-launcher {
      --public-burgundy: #7e1830;
      --public-burgundy-hover: #641126;
      --public-burgundy-light: #9a203d;
      --public-burgundy-soft: #fbf2f4;
      --public-burgundy-border: #e2c0c8;
      --mascot-outline: #521020;
      display: inline-flex;
      align-items: center;
      gap: 0.55rem;
      min-height: 3.25rem;
      padding: 0.45rem 1.15rem 0.45rem 0.65rem;
      border: 1px solid #7e1830;
      border-radius: 999px;
      background: linear-gradient(135deg, #7e1830 0%, #9a203d 100%);
      color: #ffffff;
      font: inherit;
      font-size: 0.94rem;
      font-weight: 700;
      box-shadow: 0 8px 24px rgba(126, 24, 48, 0.28);
    }

    .mock-launcher-badge {
      padding: 0.4rem 1.15rem 0.4rem 0.5rem;
      min-height: 4.1rem;
    }

    .mock-launcher-circle {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      gap: 0.3rem;
    }

    .mock-launcher-orb {
      --public-burgundy: #7e1830;
      --public-burgundy-hover: #641126;
      --public-burgundy-light: #9a203d;
      --public-burgundy-soft: #fbf2f4;
      --public-burgundy-border: #e2c0c8;
      --mascot-outline: #521020;
      width: 68px;
      height: 68px;
      border-radius: 50%;
      border: 1px solid #7e1830;
      background: linear-gradient(135deg, #7e1830 0%, #9a203d 100%);
      box-shadow: 0 8px 24px rgba(126, 24, 48, 0.28);
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .mock-launcher-circle span {
      font-size: 0.76rem;
      font-weight: 700;
      color: var(--page-muted);
    }

    .mock-panel {
      border: 1px solid var(--page-border);
      border-radius: 1rem;
      background: var(--page-surface);
      overflow: hidden;
      box-shadow: 0 12px 28px rgba(15, 23, 42, 0.12);
    }

    .mock-header {
      --public-burgundy: #7e1830;
      --public-burgundy-hover: #641126;
      --public-burgundy-light: #9a203d;
      --public-burgundy-soft: #fbf2f4;
      --public-burgundy-border: #e2c0c8;
      --mascot-outline: #521020;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.65rem;
      padding: 0.7rem 0.9rem;
      background: #7e1830;
      color: #ffffff;
    }

    .mock-header-brand {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      min-width: 0;
    }

    .mock-header-title {
      margin: 0;
      font-size: 0.96rem;
      font-weight: 700;
      line-height: 1.25;
      overflow-wrap: anywhere;
    }

    .mock-close {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 2rem;
      height: 2rem;
      border: 1px solid rgba(255, 255, 255, 0.35);
      border-radius: 0.5rem;
      background: rgba(255, 255, 255, 0.12);
      color: #ffffff;
      font-size: 0.95rem;
      flex-shrink: 0;
    }

    .mock-notice {
      margin: 0;
      padding: 0.45rem 0.85rem;
      border-bottom: 1px solid var(--page-border);
      background: var(--notice-bg);
      color: var(--notice-text);
      font-size: 0.74rem;
    }

    .mock-log {
      padding: 0.85rem;
      background: var(--chat-log-bg);
      display: grid;
      gap: 0.65rem;
    }

    .mock-msg-row {
      display: flex;
      align-items: flex-end;
      gap: 0.5rem;
      min-width: 0;
    }

    .mock-msg-body {
      display: grid;
      gap: 0.4rem;
      min-width: 0;
      max-width: 90%;
    }

    .mock-bubble {
      margin: 0;
      padding: 0.6rem 0.8rem;
      border: 1px solid var(--page-border);
      border-radius: 0.85rem;
      border-end-start-radius: 0.25rem;
      background: var(--page-surface);
      color: var(--page-text);
      font-size: 0.86rem;
      line-height: 1.45;
      overflow-wrap: anywhere;
    }

    .mock-action-btn {
      width: fit-content;
      padding: 0.32rem 0.7rem;
      border: 1px solid var(--public-burgundy);
      border-radius: 0.5rem;
      background: var(--page-surface);
      color: var(--public-burgundy);
      font-size: 0.78rem;
      font-weight: 700;
    }

    .rtl-box {
      border: 1px solid var(--page-border);
      border-radius: 0.85rem;
      background: var(--page-surface-alt);
      padding: 0.95rem;
      display: grid;
      gap: 0.85rem;
    }

    .rtl-grid {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      gap: 0.9rem;
      align-items: start;
    }

    .rtl-box [dir="rtl"] .mock-launcher {
      padding: 0.45rem 0.65rem 0.45rem 1.15rem;
    }

    @media (max-width: 960px) {
      .compare-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 860px) {
      .surface-grid,
      .widget-grid,
      .rtl-grid {
        grid-template-columns: minmax(0, 1fr);
      }
    }

    @media (max-width: 480px) {
      .compare-grid {
        grid-template-columns: minmax(0, 1fr);
      }
      .concept-card {
        padding: 0.9rem;
      }
      .surface-panel,
      .mock-box,
      .rtl-box {
        padding: 0.75rem;
      }
      .size-strip {
        gap: 0.65rem 0.7rem;
      }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand-head">
        <h1>Uluslararası Ofis Asistanı — Mascot Concepts (Round 2)</h1>
        <p>Design draft review (2026-11-20) · 3 new culturally-warm alternatives + Round-1 Owl reference · Offline</p>
      </div>
      <div class="controls">
        <div class="control-group" role="group" aria-label="Widget preview state">
          <button type="button" class="btn" data-state-btn="idle" aria-pressed="true">Idle</button>
          <button type="button" class="btn" data-state-btn="thinking" aria-pressed="false">Thinking</button>
          <button type="button" class="btn" data-state-btn="handoff" aria-pressed="false">Handoff</button>
        </div>
        <button type="button" class="btn" id="toggle-dark" aria-pressed="false">Dark mode</button>
        <button type="button" class="btn" id="toggle-motion" aria-pressed="false">Reduced motion</button>
      </div>
    </div>
  </header>

  <main id="preview-root"></main>

  <!-- Inline SVG templates (identical to concept-4-migratory-swallow.svg, concept-5-istanbul-cat.svg, concept-6-kapi-gate.svg) -->
  <template id="tpl-concept-4">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" class="mascot-svg mascot-swallow" aria-hidden="true" focusable="false">
      <title>Kırlangıç — Migratory Swallow Office Mascot</title>
      <style>
        .mascot-swallow {
          --m-primary: var(--public-burgundy, #7e1830);
          --m-primary-light: var(--public-burgundy-light, #9a203d);
          --m-outline: var(--mascot-outline, var(--public-burgundy-hover, #641126));
          --m-soft: var(--public-burgundy-soft, #fbf2f4);
          --m-border: var(--public-burgundy-border, #e2c0c8);
          --m-plumage: var(--mascot-plumage, #5d7296);
          --m-wing: var(--mascot-wing, #758bb0);
          --m-surface: var(--mascot-surface, #fff9fa);
          --m-card: var(--mascot-card, #ffffff);
          --m-ink: var(--mascot-ink, #241b22);
          --m-accent: var(--mascot-accent, #d89b27);
        }
        .mascot-swallow #state-thinking,
        .mascot-swallow #state-handoff { display: none; }
        .mascot-swallow.is-thinking #state-idle,
        .mascot-swallow.is-thinking #state-handoff { display: none; }
        .mascot-swallow.is-thinking #state-thinking { display: inline; }
        .mascot-swallow.is-handoff #state-idle,
        .mascot-swallow.is-handoff #state-thinking { display: none; }
        .mascot-swallow.is-handoff #state-handoff { display: inline; }
        .mascot-swallow .swl-dot { animation: swlPulse 1.35s ease-in-out infinite; }
        .mascot-swallow .swl-dot-2 { animation-delay: 0.2s; }
        .mascot-swallow .swl-dot-3 { animation-delay: 0.4s; }
        @keyframes swlPulse {
          0%, 80%, 100% { opacity: 0.3; }
          40% { opacity: 1; }
        }
        @media (prefers-reduced-motion: reduce) {
          .mascot-swallow .swl-dot { animation: none; opacity: 1; }
        }
      </style>
      <g class="swallow-base">

        <path d="M28.2 53.8 L32 57.6 L35.8 53.8" fill="none" stroke="var(--m-primary)" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
    </svg>
  </template>

  <script>
    (() => {
      const CONCEPTS = [
        {
          id: 'concept-4',
          mode: 'inline',
          file: 'concept-4-migratory-swallow.svg',
          shortTitle: '4 · Kırlangıç',
          shortSub: 'Migratory Swallow',
          title: 'Concept 4 — Kırlangıç / Topi (Migratory Swallow)',
          caption: 'A plump, welcoming barn swallow with a subtle forked tail, slate-blue plumage, cream breast, and tiny burgundy office lanyard — evoking safe arrival and seasonal "göç".'
        },
        {
          id: 'concept-5',
          mode: 'inline',
          file: 'concept-5-istanbul-cat.svg',
          shortTitle: '5 · Topi (Kedi)',
          shortSub: 'Istanbul Cat',
          title: 'Concept 5 — Topi (Istanbul Cat)',
          caption: 'A calm, round cream-and-grey Istanbul street cat with soft tabby stripes, a burgundy collar, and a small blank office tag — warmly familiar to every visitor.'
        },
        {
          id: 'concept-6',
          mode: 'inline',
          file: 'concept-6-kapi-gate.svg',
          shortTitle: '6 · Kapı',
          shortSub: 'Welcoming Gate',
          title: 'Concept 6 — Kapı (Welcoming Arched Gate)',
          caption: 'A friendly secular arched gateway (echoing "Topkapı" without cannons) whose burgundy double doors swing wide open in handoff to point downward toward the question form.'
        },
        {
          id: 'concept-1-ref',
          mode: 'img',
          imgSrc: '../concept-1-lanyard-owl.svg',
          file: '../concept-1-lanyard-owl.svg',
          shortTitle: '1 · Puhu (R1)',
          shortSub: 'Round-1 Owl ref',
          title: 'Round-1 Reference — Puhu (Lanyard Owl)',
          caption: 'Included side by side from Round 1 for direct visual comparison against the three Round-2 directions.'
        }
      ];

      const SIZES = [28, 36, 56, 120];
      const STATES = [
        { key: 'idle', label: 'Idle (default)' },
        { key: 'thinking', label: 'Thinking (.is-thinking)' },
        { key: 'handoff', label: 'Handoff (.is-handoff)' }
      ];

      const root = document.getElementById('preview-root');

      function renderMascot(concept, sizePx, stateKey, isInteractive = false) {
        const slot = document.createElement('span');
        slot.className = 'mascot-slot';
        slot.style.width = `${sizePx}px`;
        slot.style.height = `${sizePx}px`;

        if (concept.mode === 'img') {
          const img = document.createElement('img');
          img.src = concept.imgSrc;
          img.alt = '';
          img.setAttribute('aria-hidden', 'true');
          slot.append(img);
          return slot;
        }

        const tpl = document.getElementById(`tpl-${concept.id}`);
        const svg = tpl.content.firstElementChild.cloneNode(true);
        if (stateKey === 'thinking') svg.classList.add('is-thinking');
        if (stateKey === 'handoff') svg.classList.add('is-handoff');
        if (isInteractive) svg.dataset.liveMascot = 'true';
        slot.append(svg);
        return slot;
      }

      function buildComparisonStrip() {
        const section = document.createElement('section');
        section.className = 'concept-card';

        const head = document.createElement('div');
        head.className = 'concept-head';
        head.innerHTML = `
          <h2>Side-by-Side Comparison (Round 2 vs. Round-1 Owl)</h2>
          <span class="concept-file">56 px &amp; 28 px · Light / Dark / Burgundy</span>
          <p class="concept-caption">Compare silhouette readability across white, dark, and burgundy launcher surfaces. Use the top Idle / Thinking / Handoff toggle to test Round-2 state changes live.</p>
        `;
        section.append(head);

        const grid = document.createElement('div');
        grid.className = 'compare-grid';

        for (const concept of CONCEPTS) {
          const tile = document.createElement('div');
          tile.className = 'compare-tile';

          const h3 = document.createElement('h3');
          h3.textContent = concept.shortTitle;
          const sub = document.createElement('p');
          sub.className = 'compare-sub';
          sub.textContent = concept.shortSub;

          const swatches = document.createElement('div');
          swatches.className = 'compare-swatches';

          for (const sw of ['light', 'dark', 'burgundy']) {
            const box = document.createElement('div');
            box.className = `swatch swatch-${sw}`;
            box.append(
              renderMascot(concept, 56, 'idle', true),
              renderMascot(concept, 28, 'idle', true)
            );
            swatches.append(box);
          }

          tile.append(h3, sub, swatches);
          grid.append(tile);
        }

        section.append(grid);
        return section;
      }

      function buildSurfacePanel(concept, mode) {
        const panel = document.createElement('div');
        panel.className = `surface-panel surface-${mode}`;

        const heading = document.createElement('div');
        heading.className = 'surface-title';
        heading.innerHTML = mode === 'light'
          ? '<span>Light surface</span><span>#ffffff · default tokens</span>'
          : '<span>Dark surface</span><span>#161922 · dark-mode tokens</span>';
        panel.append(heading);

        const statesToShow = concept.mode === 'img'
          ? [{ key: 'idle', label: 'Idle (external <img> reference)' }]
          : STATES;

        for (const state of statesToShow) {
          const row = document.createElement('div');
          row.className = 'state-row';

          const lbl = document.createElement('div');
          lbl.className = 'state-row-label';
          lbl.textContent = state.label;

          const strip = document.createElement('div');
          strip.className = 'size-strip';
          for (const sz of SIZES) {
            const cell = document.createElement('div');
            cell.className = 'size-cell';
            cell.append(renderMascot(concept, sz, state.key, false));
            const tag = document.createElement('code');
            tag.textContent = `${sz}px`;
            cell.append(tag);
            strip.append(cell);
          }

          row.append(lbl, strip);
          panel.append(row);
        }

        return panel;
      }

      function buildConceptSection(concept) {
        const section = document.createElement('section');
        section.className = concept.mode === 'img' ? 'concept-card is-reference' : 'concept-card';

        const head = document.createElement('div');
        head.className = 'concept-head';
        head.innerHTML = `
          <h2>${concept.title}</h2>
          <span class="concept-file">${concept.file}</span>
          <p class="concept-caption">${concept.caption}</p>
        `;
        section.append(head);

        if (concept.mode === 'img') {
          const note = document.createElement('p');
          note.className = 'ref-note';
          note.textContent = 'Loaded via <img src="../concept-1-lanyard-owl.svg"> so Round-1 files stay untouched. External <img> renders the default idle state with fallback tokens; open ../preview.html for interactive owl states.';
          section.append(note);
        }

        // 1. Scale & State Matrix
        const matrixWrap = document.createElement('div');
        const matrixLabel = document.createElement('p');
        matrixLabel.className = 'section-label';
        matrixLabel.textContent = concept.mode === 'img'
          ? 'Sizes (28 / 36 / 56 / 120 px) on Light / Dark Backgrounds'
          : 'Sizes (28 / 36 / 56 / 120 px) & States on Light / Dark Backgrounds';

        const surfaceGrid = document.createElement('div');
        surfaceGrid.className = 'surface-grid';
        surfaceGrid.append(
          buildSurfacePanel(concept, 'light'),
          buildSurfacePanel(concept, 'dark')
        );
        matrixWrap.append(matrixLabel, surfaceGrid);
        section.append(matrixWrap);

        // 2. Widget Context Mockups (LTR Turkish)
        const widgetWrap = document.createElement('div');
        const widgetLabel = document.createElement('p');
        widgetLabel.className = 'section-label';
        widgetLabel.textContent = concept.mode === 'img'
          ? 'Widget Context (LTR — Turkish · idle reference)'
          : 'Widget Context (LTR — Turkish · switches with top Idle / Thinking / Handoff toggle)';

        const widgetGrid = document.createElement('div');
        widgetGrid.className = 'widget-grid';

        const launcherBox = document.createElement('div');
        launcherBox.className = 'mock-box';
        const lTitle = document.createElement('div');
        lTitle.className = 'state-row-label';
        lTitle.textContent = 'Launcher buttons (burgundy gradient pill & 56 px mascot)';

        const launcherSamples = document.createElement('div');
        launcherSamples.className = 'launcher-samples';

        const pillBtn = document.createElement('div');
        pillBtn.className = 'mock-launcher';
        pillBtn.append(renderMascot(concept, 36, 'idle', true));
        const pillText = document.createElement('span');
        pillText.textContent = 'Asistan';
        pillBtn.append(pillText);

        const pillLg = document.createElement('div');
        pillLg.className = 'mock-launcher mock-launcher-badge';
        pillLg.append(renderMascot(concept, 56, 'idle', true));
        const pillLgText = document.createElement('span');
        pillLgText.textContent = 'Asistan';
        pillLg.append(pillLgText);

        const orbWrap = document.createElement('div');
        orbWrap.className = 'mock-launcher-circle';
        const orb = document.createElement('div');
        orb.className = 'mock-launcher-orb';
        orb.append(renderMascot(concept, 56, 'idle', true));
        const orbCap = document.createElement('span');
        orbCap.textContent = 'Asistan (56px)';
        orbWrap.append(orb, orbCap);

        launcherSamples.append(pillBtn, pillLg, orbWrap);
        launcherBox.append(lTitle, launcherSamples);

        const panelBox = document.createElement('div');
        panelBox.className = 'mock-panel';

        const header = document.createElement('div');
        header.className = 'mock-header';
        const headerBrand = document.createElement('div');
        headerBrand.className = 'mock-header-brand';
        headerBrand.append(renderMascot(concept, 36, 'idle', true));
        const hTitle = document.createElement('h3');
        hTitle.className = 'mock-header-title';
        hTitle.textContent = 'Uluslararası Ofis Asistanı';
        headerBrand.append(hTitle);
        const closeBtn = document.createElement('span');
        closeBtn.className = 'mock-close';
        closeBtn.setAttribute('aria-hidden', 'true');
        closeBtn.textContent = '✕';
        header.append(headerBrand, closeBtn);

        const notice = document.createElement('p');
        notice.className = 'mock-notice';
        notice.textContent = 'Yapay zekâ hata yapabilir; resmi karar Uluslararası Ofise aittir';

        const log = document.createElement('div');
        log.className = 'mock-log';
        const msgRow = document.createElement('div');
        msgRow.className = 'mock-msg-row';
        msgRow.append(renderMascot(concept, 28, 'idle', true));

        const msgBody = document.createElement('div');
        msgBody.className = 'mock-msg-body';
        const bubble = document.createElement('p');
        bubble.className = 'mock-bubble';
        bubble.textContent = 'Merhaba! Başvuru süreci, gerekli belgeler veya başvuru durumunuz hakkında soru sorabilirsiniz.';
        const actionBtn = document.createElement('span');
        actionBtn.className = 'mock-action-btn';
        actionBtn.textContent = 'Soru formuna git';
        msgBody.append(bubble, actionBtn);
        msgRow.append(msgBody);
        log.append(msgRow);

        panelBox.append(header, notice, log);
        widgetGrid.append(launcherBox, panelBox);
        widgetWrap.append(widgetLabel, widgetGrid);
        section.append(widgetWrap);

        // 3. RTL Sample Row (Arabic)
        const rtlWrap = document.createElement('div');
        const rtlLabel = document.createElement('p');
        rtlLabel.className = 'section-label';
        rtlLabel.textContent = 'RTL Sample Row (dir="rtl" · Arabic "المساعد")';

        const rtlBox = document.createElement('div');
        rtlBox.className = 'rtl-box';

        const rtlInner = document.createElement('div');
        rtlInner.className = 'rtl-grid';
        rtlInner.setAttribute('dir', 'rtl');
        rtlInner.setAttribute('lang', 'ar');

        const arLauncher = document.createElement('div');
        arLauncher.className = 'mock-launcher';
        arLauncher.append(renderMascot(concept, 36, 'idle', true));
        const arLauncherText = document.createElement('span');
        arLauncherText.textContent = 'المساعد';
        arLauncher.append(arLauncherText);

        const arPanel = document.createElement('div');
        arPanel.className = 'mock-panel';

        const arHeader = document.createElement('div');
        arHeader.className = 'mock-header';
        const arHeaderBrand = document.createElement('div');
        arHeaderBrand.className = 'mock-header-brand';
        arHeaderBrand.append(renderMascot(concept, 36, 'idle', true));
        const arTitle = document.createElement('h3');
        arTitle.className = 'mock-header-title';
        arTitle.textContent = 'مساعد المكتب الدولي';
        arHeaderBrand.append(arTitle);
        const arClose = document.createElement('span');
        arClose.className = 'mock-close';
        arClose.setAttribute('aria-hidden', 'true');
        arClose.textContent = '✕';
        arHeader.append(arHeaderBrand, arClose);

        const arLog = document.createElement('div');
        arLog.className = 'mock-log';
        const arMsgRow = document.createElement('div');
        arMsgRow.className = 'mock-msg-row';
        arMsgRow.append(renderMascot(concept, 28, 'idle', true));
        const arMsgBody = document.createElement('div');
        arMsgBody.className = 'mock-msg-body';
        const arBubble = document.createElement('p');
        arBubble.className = 'mock-bubble';
        arBubble.textContent = 'مرحباً! يمكنك السؤال عن إجراءات التقديم أو المستندات المطلوبة أو حالة طلبك.';
        arMsgBody.append(arBubble);
        arMsgRow.append(arMsgBody);
        arLog.append(arMsgRow);

        arPanel.append(arHeader, arLog);
        rtlInner.append(arLauncher, arPanel);
        rtlBox.append(rtlInner);
        rtlWrap.append(rtlLabel, rtlBox);
        section.append(rtlWrap);

        return section;
      }

      root.append(buildComparisonStrip());
      for (const concept of CONCEPTS) {
        root.append(buildConceptSection(concept));
      }

      const stateButtons = [...document.querySelectorAll('[data-state-btn]')];
      function setLiveState(nextState) {
        for (const btn of stateButtons) {
          btn.setAttribute('aria-pressed', String(btn.dataset.stateBtn === nextState));
        }
        for (const svg of document.querySelectorAll('svg[data-live-mascot="true"]')) {
          svg.classList.toggle('is-thinking', nextState === 'thinking');
          svg.classList.toggle('is-handoff', nextState === 'handoff');
        }
      }
      for (const btn of stateButtons) {
        btn.addEventListener('click', () => setLiveState(btn.dataset.stateBtn));
      }

      const darkBtn = document.getElementById('toggle-dark');
      darkBtn.addEventListener('click', () => {
        const next = !document.body.classList.contains('is-dark');
        document.body.classList.toggle('is-dark', next);
        darkBtn.setAttribute('aria-pressed', String(next));
      });

      const motionBtn = document.getElementById('toggle-motion');
      motionBtn.addEventListener('click', () => {
        const next = !document.body.classList.contains('is-reduced-motion');
        document.body.classList.toggle('is-reduced-motion', next);
        motionBtn.setAttribute('aria-pressed', String(next));
      });
    })();
  </script>
</body>
</html>
