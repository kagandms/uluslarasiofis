<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" class="mascot-svg mascot-cat" aria-hidden="true" focusable="false">
  <title>Topi — Istanbul Cat Office Mascot</title>
  <style>
    .mascot-cat {
      --m-primary: var(--public-burgundy, #7e1830);
      --m-primary-light: var(--public-burgundy-light, #9a203d);
      --m-outline: var(--mascot-outline, var(--public-burgundy-hover, #641126));
      --m-soft: var(--public-burgundy-soft, #fbf2f4);
      --m-border: var(--public-burgundy-border, #e2c0c8);
      --m-coat: var(--mascot-coat, #f6efe9);
      --m-mark: var(--mascot-mark, #c7bec2);
      --m-surface: var(--mascot-surface, #fffbf8);
      --m-card: var(--mascot-card, #ffffff);
      --m-ink: var(--mascot-ink, #241b22);
      --m-accent: var(--mascot-accent, #d89b27);
    }
    .mascot-cat #state-thinking,
    .mascot-cat #state-handoff { display: none; }
    .mascot-cat.is-thinking #state-idle,
    .mascot-cat.is-thinking #state-handoff { display: none; }
    .mascot-cat.is-thinking #state-thinking { display: inline; }
    .mascot-cat.is-handoff #state-idle,
    .mascot-cat.is-handoff #state-thinking { display: none; }
    .mascot-cat.is-handoff #state-handoff { display: inline; }
    .mascot-cat .cat-dot { animation: catPulse 1.35s ease-in-out infinite; }
    .mascot-cat .cat-dot-2 { animation-delay: 0.2s; }
    .mascot-cat .cat-dot-3 { animation-delay: 0.4s; }
    @keyframes catPulse {
      0%, 80%, 100% { opacity: 0.3; }
      40% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      .mascot-cat .cat-dot { animation: none; opacity: 1; }
    }
  </style>
  <g class="cat-base">
    <path d="M16.5 42 C14.5 49.5, 16.5 56.5, 23 56.5 L41 56.5 C47.5 56.5, 49.5 49.5, 47.5 42 Z" fill="var(--m-coat)" stroke="var(--m-outline)" stroke-width="2.3" stroke-linejoin="round"/>
    <ellipse cx="32" cy="49.5" rx="10.4" ry="6" fill="var(--m-surface)"/>
    <path d="M14.8 25.5 L14.4 14.4 C14.3 12, 17 11.1, 19.1 12.6 L25.6 17.2 C29.6 16.3, 34.4 16.3, 38.4 17.2 L44.9 12.6 C47 11.1, 49.7 12, 49.6 14.4 L49.2 25.5 C52 28.6, 52.5 33.4, 50.2 37.4 C47.2 42.4, 40.4 44.6, 32 44.6 C23.6 44.6, 16.8 42.4, 13.8 37.4 C11.5 33.4, 12 28.6, 14.8 25.5 Z" fill="var(--m-coat)" stroke="var(--m-outline)" stroke-width="2.3" stroke-linejoin="round"/>
    <path d="M17.2 21.8 L17.1 15.2 L22.2 18.8 Z" fill="var(--m-border)"/>
    <path d="M46.8 21.8 L46.9 15.2 L41.8 18.8 Z" fill="var(--m-border)"/>
    <rect x="30.6" y="17.2" width="2.8" height="5" rx="1.4" fill="var(--m-mark)"/>
    <rect x="26.2" y="17.8" width="2.4" height="3.8" rx="1.2" fill="var(--m-mark)"/>
    <rect x="35.4" y="17.8" width="2.4" height="3.8" rx="1.2" fill="var(--m-mark)"/>
    <line x1="10.2" y1="32.8" x2="16.4" y2="33.5" stroke="var(--m-outline)" stroke-width="1.6" stroke-linecap="round"/>
    <line x1="11.2" y1="36.8" x2="16.8" y2="36.1" stroke="var(--m-outline)" stroke-width="1.6" stroke-linecap="round"/>
    <line x1="53.8" y1="32.8" x2="47.6" y2="33.5" stroke="var(--m-outline)" stroke-width="1.6" stroke-linecap="round"/>
    <line x1="52.8" y1="36.8" x2="47.2" y2="36.1" stroke="var(--m-outline)" stroke-width="1.6" stroke-linecap="round"/>
    <ellipse cx="32" cy="36" rx="7.6" ry="4.6" fill="var(--m-surface)"/>
    <path d="M30.1 33.2 Q32 32.4 33.9 33.2 L32 35.4 Z" fill="var(--m-primary-light)"/>
    <path d="M19.5 43.4 Q32 47.6 44.5 43.4" fill="none" stroke="var(--m-primary)" stroke-width="3.3" stroke-linecap="round"/>
    <circle cx="32" cy="46.2" r="1.4" fill="var(--m-accent)" stroke="var(--m-outline)" stroke-width="1"/>
    <rect x="26.2" y="47.2" width="11.6" height="7.6" rx="2" fill="var(--m-card)" stroke="var(--m-primary)" stroke-width="1.7"/>
    <rect x="27.4" y="48.3" width="9.2" height="2" rx="0.7" fill="var(--m-primary)"/>
    <line x1="28.6" y1="52.2" x2="35.4" y2="52.2" stroke="var(--m-border)" stroke-width="1.4" stroke-linecap="round"/>
  </g>
  <g id="state-idle">
    <circle cx="23.5" cy="29.2" r="2.8" fill="var(--m-ink)"/>
    <circle cx="40.5" cy="29.2" r="2.8" fill="var(--m-ink)"/>
    <circle cx="24.4" cy="28.3" r="0.95" fill="#ffffff"/>
    <circle cx="41.4" cy="28.3" r="0.95" fill="#ffffff"/>
    <path d="M28.4 37 Q30.2 39 32 37 Q33.8 39 35.6 37" fill="none" stroke="var(--m-ink)" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    <ellipse cx="19.5" cy="55.2" rx="4.2" ry="2.7" fill="var(--m-surface)" stroke="var(--m-outline)" stroke-width="2"/>
    <ellipse cx="44.5" cy="55.2" rx="4.2" ry="2.7" fill="var(--m-surface)" stroke="var(--m-outline)" stroke-width="2"/>
  </g>
  <g id="state-thinking">
    <circle cx="24.5" cy="28" r="2.7" fill="var(--m-ink)"/>
    <circle cx="41.5" cy="28" r="2.7" fill="var(--m-ink)"/>
    <circle cx="25.4" cy="27.1" r="0.9" fill="#ffffff"/>
    <circle cx="42.4" cy="27.1" r="0.9" fill="#ffffff"/>
    <path d="M29.8 37.8 Q32 37 34.2 37.8" fill="none" stroke="var(--m-ink)" stroke-width="1.7" stroke-linecap="round"/>
    <ellipse cx="19.5" cy="55.2" rx="4.2" ry="2.7" fill="var(--m-surface)" stroke="var(--m-outline)" stroke-width="2"/>
    <path d="M42.8 48.8 C46.5 45.8, 50.8 47.4, 49.6 51.8 C48.4 55, 43.2 55.1, 42 52 Z" fill="var(--m-surface)" stroke="var(--m-outline)" stroke-width="2" stroke-linejoin="round"/>
    <rect x="41.5" y="1.6" width="19.5" height="8.8" rx="4.4" fill="var(--m-card)" stroke="var(--m-primary)" stroke-width="1.8"/>
    <circle class="cat-dot cat-dot-1" cx="46.8" cy="6" r="1.4" fill="var(--m-primary)"/>
    <circle class="cat-dot cat-dot-2" cx="51.25" cy="6" r="1.4" fill="var(--m-primary)"/>
    <circle class="cat-dot cat-dot-3" cx="55.7" cy="6" r="1.4" fill="var(--m-primary)"/>
  </g>
  <g id="state-handoff">
    <circle cx="23.5" cy="30.6" r="2.8" fill="var(--m-ink)"/>
    <circle cx="40.5" cy="30.6" r="2.8" fill="var(--m-ink)"/>
    <circle cx="24.4" cy="29.7" r="0.95" fill="#ffffff"/>
    <circle cx="41.4" cy="29.7" r="0.95" fill="#ffffff"/>
    <path d="M28.4 36.8 Q30.2 38.6 32 36.8 Q33.8 38.6 35.6 36.8" fill="none" stroke="var(--m-ink)" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    <ellipse cx="19.5" cy="55.2" rx="4.2" ry="2.7" fill="var(--m-surface)" stroke="var(--m-outline)" stroke-width="2"/>
    <path d="M43 48.2 C48.5 47.4, 51.5 51.4, 49.2 55.4 C47.4 57.8, 43.2 56.4, 42.4 52.6 Z" fill="var(--m-surface)" stroke="var(--m-outline)" stroke-width="2" stroke-linejoin="round"/>
    <circle cx="52.2" cy="55.8" r="5.3" fill="var(--m-card)" stroke="var(--m-primary)" stroke-width="1.8"/>
    <path d="M49.8 54.8 L52.2 57.5 L54.6 54.8" fill="none" stroke="var(--m-primary)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
