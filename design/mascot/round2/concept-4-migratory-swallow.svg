<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" class="mascot-svg mascot-swallow" aria-hidden="true" focusable="false">
  <title>Kırlangıç — Migratory Swallow Office Mascot</title>
  <style>
    .mascot-swallow {
      --m-primary: var(--public-burgundy, #7e1830);
      --m-primary-light: var(--public-burgundy-light, #9a203d);
      --m-outline: var(--mascot-outline, var(--public-burgundy-hover, #641126));
      --m-soft: var(--public-burgundy-soft, #fbf2f4);
      --m-border: var(--public-burgundy-border, #e2c0c8);
      --m-plumage: var(--mascot-plumage, #5d7296);
      --m-wing: var(--mascot-wing, #758bb0);
      --m-surface: var(--mascot-surface, #fff9fa);
      --m-card: var(--mascot-card, #ffffff);
      --m-ink: var(--mascot-ink, #241b22);
      --m-accent: var(--mascot-accent, #d89b27);
    }
    .mascot-swallow #state-thinking,
    .mascot-swallow #state-handoff { display: none; }
    .mascot-swallow.is-thinking #state-idle,
    .mascot-swallow.is-thinking #state-handoff { display: none; }
    .mascot-swallow.is-thinking #state-thinking { display: inline; }
    .mascot-swallow.is-handoff #state-idle,
    .mascot-swallow.is-handoff #state-thinking { display: none; }
    .mascot-swallow.is-handoff #state-handoff { display: inline; }
    .mascot-swallow .swl-dot { animation: swlPulse 1.35s ease-in-out infinite; }
    .mascot-swallow .swl-dot-2 { animation-delay: 0.2s; }
    .mascot-swallow .swl-dot-3 { animation-delay: 0.4s; }
    @keyframes swlPulse {
      0%, 80%, 100% { opacity: 0.3; }
      40% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      .mascot-swallow .swl-dot { animation: none; opacity: 1; }
    }
  </style>
  <g class="swallow-base">
    <path d="M19 46 L10.5 57.5 L23 52.5 Z" fill="var(--m-plumage)" stroke="var(--m-outline)" stroke-width="2.1" stroke-linejoin="round"/>
    <path d="M45 46 L53.5 57.5 L41 52.5 Z" fill="var(--m-plumage)" stroke="var(--m-outline)" stroke-width="2.1" stroke-linejoin="round"/>
    <ellipse cx="26" cy="56.5" rx="2.9" ry="1.7" fill="var(--m-accent)" stroke="var(--m-outline)" stroke-width="1.5"/>
    <ellipse cx="38" cy="56.5" rx="2.9" ry="1.7" fill="var(--m-accent)" stroke="var(--m-outline)" stroke-width="1.5"/>
    <path d="M32 10.5 C43.5 10.5, 50.5 19, 50.5 32.5 C50.5 46, 43.2 55.2, 32 55.2 C20.8 55.2, 13.5 46, 13.5 32.5 C13.5 19, 20.5 10.5, 32 10.5 Z" fill="var(--m-plumage)" stroke="var(--m-outline)" stroke-width="2.3" stroke-linejoin="round"/>
    <ellipse cx="32" cy="43.5" rx="14.5" ry="10.2" fill="var(--m-surface)"/>
    <path d="M17.2 28.5 C17.2 21, 23 17.5, 28.2 19.5 C30.2 20.3, 31.3 21.8, 32 23 C32.7 21.8, 33.8 20.3, 35.8 19.5 C41 17.5, 46.8 21, 46.8 28.5 C46.8 35.2, 41.2 38.5, 32 38.5 C22.8 38.5, 17.2 35.2, 17.2 28.5 Z" fill="var(--m-surface)"/>
    <circle cx="20.4" cy="31.2" r="2.2" fill="var(--m-border)" opacity="0.7"/>
    <circle cx="43.6" cy="31.2" r="2.2" fill="var(--m-border)" opacity="0.7"/>
    <path d="M29 29.6 Q32 27.6 35 29.6 L32 33.5 Z" fill="var(--m-accent)" stroke="var(--m-outline)" stroke-width="1.5" stroke-linejoin="round"/>
    <path d="M21.5 36.2 L32 42.8 L42.5 36.2" fill="none" stroke="var(--m-primary)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="30.3" y="41.4" width="3.4" height="2.4" rx="1" fill="var(--m-outline)"/>
    <rect x="25.8" y="43.6" width="12.4" height="8.6" rx="1.9" fill="var(--m-card)" stroke="var(--m-primary)" stroke-width="1.7"/>
    <rect x="27" y="44.8" width="10" height="2.2" rx="0.7" fill="var(--m-primary)"/>
    <line x1="28" y1="48.9" x2="36" y2="48.9" stroke="var(--m-border)" stroke-width="1.4" stroke-linecap="round"/>
    <line x1="28" y1="50.8" x2="33.5" y2="50.8" stroke="var(--m-border)" stroke-width="1.4" stroke-linecap="round"/>
  </g>
  <g id="state-idle">
    <path d="M14.5 29.5 C8.5 33, 8.2 42.5, 14.2 46.8 C15.8 42.5, 16.2 35.2, 14.5 29.5 Z" fill="var(--m-wing)" stroke="var(--m-outline)" stroke-width="2.1" stroke-linejoin="round"/>
    <path d="M49.5 29.5 C55.5 33, 55.8 42.5, 49.8 46.8 C48.2 42.5, 47.8 35.2, 49.5 29.5 Z" fill="var(--m-wing)" stroke="var(--m-outline)" stroke-width="2.1" stroke-linejoin="round"/>
    <circle cx="24.5" cy="27" r="2.9" fill="var(--m-ink)"/>
    <circle cx="39.5" cy="27" r="2.9" fill="var(--m-ink)"/>
    <circle cx="25.5" cy="26" r="1" fill="#ffffff"/>
    <circle cx="40.5" cy="26" r="1" fill="#ffffff"/>
  </g>
  <g id="state-thinking">
    <path d="M14.5 29.5 C8.5 33, 8.2 42.5, 14.2 46.8 C15.8 42.5, 16.2 35.2, 14.5 29.5 Z" fill="var(--m-wing)" stroke="var(--m-outline)" stroke-width="2.1" stroke-linejoin="round"/>
    <path d="M49.2 30.2 C55.2 31.2, 56 37.5, 50.2 41.2 C47 43, 44.6 40.6, 46.4 37.8 C47.6 35.8, 48.5 33, 49.2 30.2 Z" fill="var(--m-wing)" stroke="var(--m-outline)" stroke-width="2.1" stroke-linejoin="round"/>
    <circle cx="25.4" cy="25.7" r="2.8" fill="var(--m-ink)"/>
    <circle cx="40.4" cy="25.7" r="2.8" fill="var(--m-ink)"/>
    <circle cx="26.3" cy="24.8" r="0.95" fill="#ffffff"/>
    <circle cx="41.3" cy="24.8" r="0.95" fill="#ffffff"/>
    <rect x="41.5" y="2.8" width="19" height="9.4" rx="4.7" fill="var(--m-card)" stroke="var(--m-primary)" stroke-width="1.8"/>
    <circle class="swl-dot swl-dot-1" cx="46.6" cy="7.5" r="1.45" fill="var(--m-primary)"/>
    <circle class="swl-dot swl-dot-2" cx="51" cy="7.5" r="1.45" fill="var(--m-primary)"/>
    <circle class="swl-dot swl-dot-3" cx="55.4" cy="7.5" r="1.45" fill="var(--m-primary)"/>
  </g>
  <g id="state-handoff">
    <path d="M14.5 29.5 C8.5 33, 8.2 42.5, 14.2 46.8 C15.8 42.5, 16.2 35.2, 14.5 29.5 Z" fill="var(--m-wing)" stroke="var(--m-outline)" stroke-width="2.1" stroke-linejoin="round"/>
    <path d="M49.2 31 C55.4 34.4, 57.6 42.4, 54.2 50.4 L51.4 53.2 L48.4 49 C49.4 44.5, 49 39.2, 47.4 35 Z" fill="var(--m-wing)" stroke="var(--m-outline)" stroke-width="2.1" stroke-linejoin="round"/>
    <circle cx="51.6" cy="55.8" r="5.4" fill="var(--m-card)" stroke="var(--m-primary)" stroke-width="1.8"/>
    <path d="M49.1 54.7 L51.6 57.5 L54.1 54.7" fill="none" stroke="var(--m-primary)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="24.5" cy="28.3" r="2.8" fill="var(--m-ink)"/>
    <circle cx="39.5" cy="28.3" r="2.8" fill="var(--m-ink)"/>
    <circle cx="25.4" cy="27.4" r="0.95" fill="#ffffff"/>
    <circle cx="40.4" cy="27.4" r="0.95" fill="#ffffff"/>
  </g>
</svg>
