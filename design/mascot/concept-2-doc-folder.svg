<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" class="mascot-svg mascot-folder" aria-hidden="true" focusable="false">
  <title>Dosya — Office Document Folder Mascot</title>
  <style>
    .mascot-folder {
      --m-primary: var(--public-burgundy, #7e1830);
      --m-primary-light: var(--public-burgundy-light, #9a203d);
      --m-outline: var(--mascot-outline, var(--public-burgundy-hover, #641126));
      --m-soft: var(--public-burgundy-soft, #fbf2f4);
      --m-border: var(--public-burgundy-border, #e2c0c8);
      --m-surface: var(--mascot-surface, #fdf4f6);
      --m-card: var(--mascot-card, #ffffff);
      --m-ink: var(--mascot-ink, #241b22);
    }
    .mascot-folder #state-thinking,
    .mascot-folder #state-handoff {
      display: none;
    }
    .mascot-folder.is-thinking #state-idle,
    .mascot-folder.is-thinking #state-handoff {
      display: none;
    }
    .mascot-folder.is-thinking #state-thinking {
      display: inline;
    }
    .mascot-folder.is-handoff #state-idle,
    .mascot-folder.is-handoff #state-thinking {
      display: none;
    }
    .mascot-folder.is-handoff #state-handoff {
      display: inline;
    }
    .mascot-folder .fld-dot {
      animation: fldDotPulse 1.35s ease-in-out infinite;
    }
    .mascot-folder .fld-dot-2 { animation-delay: 0.2s; }
    .mascot-folder .fld-dot-3 { animation-delay: 0.4s; }
    @keyframes fldDotPulse {
      0%, 80%, 100% { opacity: 0.3; }
      40% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      .mascot-folder .fld-dot {
        animation: none;
        opacity: 1;
      }
    }
  </style>

  <!-- Shared folder cover, peeking document sheet, front pocket and slim glasses -->
  <g class="folder-base">
    <!-- Back burgundy folder panel with unobstructed top-left tab -->
    <path d="M10.5 16 C10.5 13.4, 12.4 11.6, 15 11.6 L23.5 11.6 C25.1 11.6, 26.4 12.5, 27.3 14 L29 17.2 L49.5 17.2 C52 17.2, 53.5 18.8, 53.5 21.3 L53.5 48 C53.5 51, 51 53.5, 48 53.5 L16 53.5 C13 53.5, 10.5 51, 10.5 48 Z" fill="var(--m-primary)" stroke="var(--m-outline)" stroke-width="2.2" stroke-linejoin="round"/>
    <line x1="14.5" y1="14.6" x2="23.5" y2="14.6" stroke="var(--m-border)" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Crisp white document sheet peeking cleanly on the right -->
    <rect x="24.5" y="14.2" width="25.5" height="14.5" rx="2.4" fill="var(--m-card)" stroke="var(--m-outline)" stroke-width="2"/>
    <line x1="28.5" y1="18.6" x2="39.5" y2="18.6" stroke="var(--m-border)" stroke-width="2" stroke-linecap="round"/>
    <line x1="28.5" y1="22.1" x2="36" y2="22.1" stroke="var(--m-border)" stroke-width="2" stroke-linecap="round"/>
    <circle cx="44.8" cy="19.6" r="2.2" fill="var(--m-primary-light)"/>

    <!-- Bright blush-ivory front pocket (high contrast on light, dark and burgundy) -->
    <path d="M9 28.2 C9 25.8, 11 24.2, 13.5 24.2 L50.5 24.2 C53 24.2, 55 25.8, 55 28.2 L53.4 49.2 C53.1 51.9, 50.9 53.8, 48.2 53.8 L15.8 53.8 C13.1 53.8, 10.9 51.9, 10.6 49.2 Z" fill="var(--m-surface)" stroke="var(--m-primary)" stroke-width="2.4" stroke-linejoin="round"/>
    <line x1="14" y1="27.4" x2="50" y2="27.4" stroke="var(--m-border)" stroke-width="1.2" stroke-linecap="round"/>

    <!-- Sleek office glasses -->
    <circle cx="24" cy="37.4" r="5.6" fill="var(--m-card)" stroke="var(--m-primary)" stroke-width="2.1"/>
    <circle cx="40" cy="37.4" r="5.6" fill="var(--m-card)" stroke="var(--m-primary)" stroke-width="2.1"/>
    <path d="M29.6 37.4 Q32 35.6 34.4 37.4" fill="none" stroke="var(--m-primary)" stroke-width="2" stroke-linecap="round"/>
    <line x1="15.8" y1="36.7" x2="18.4" y2="37.3" stroke="var(--m-primary)" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="48.2" y1="36.7" x2="45.6" y2="37.3" stroke="var(--m-primary)" stroke-width="1.8" stroke-linecap="round"/>
  </g>

  <!-- State 1: Idle (default) -->
  <g id="state-idle">
    <circle cx="24" cy="37.4" r="2.2" fill="var(--m-ink)"/>
    <circle cx="40" cy="37.4" r="2.2" fill="var(--m-ink)"/>
    <circle cx="24.8" cy="36.6" r="0.75" fill="#ffffff"/>
    <circle cx="40.8" cy="36.6" r="0.75" fill="#ffffff"/>
    <path d="M28 46.2 Q32 49.4 36 46.2" fill="none" stroke="var(--m-ink)" stroke-width="2.1" stroke-linecap="round"/>
  </g>

  <!-- State 2: Thinking -->
  <g id="state-thinking">
    <circle cx="25" cy="36.1" r="2.1" fill="var(--m-ink)"/>
    <circle cx="41" cy="36.1" r="2.1" fill="var(--m-ink)"/>
    <circle cx="25.8" cy="35.3" r="0.7" fill="#ffffff"/>
    <circle cx="41.8" cy="35.3" r="0.7" fill="#ffffff"/>
    <path d="M29.2 46.8 Q32 46 34.8 46.8" fill="none" stroke="var(--m-ink)" stroke-width="2" stroke-linecap="round"/>
    <rect x="38.5" y="2.8" width="19.5" height="9.4" rx="4.7" fill="var(--m-card)" stroke="var(--m-primary)" stroke-width="1.8"/>
    <circle class="fld-dot fld-dot-1" cx="43.8" cy="7.5" r="1.45" fill="var(--m-primary)"/>
    <circle class="fld-dot fld-dot-2" cx="48.25" cy="7.5" r="1.45" fill="var(--m-primary)"/>
    <circle class="fld-dot fld-dot-3" cx="52.7" cy="7.5" r="1.45" fill="var(--m-primary)"/>
  </g>

  <!-- State 3: Handoff (pointer tab & arm guiding downward toward question form) -->
  <g id="state-handoff">
    <circle cx="24" cy="38.8" r="2.2" fill="var(--m-ink)"/>
    <circle cx="40" cy="38.8" r="2.2" fill="var(--m-ink)"/>
    <circle cx="24.8" cy="38" r="0.75" fill="#ffffff"/>
    <circle cx="40.8" cy="38" r="0.75" fill="#ffffff"/>
    <path d="M28.2 45.8 Q32 48.6 35.8 45.8" fill="none" stroke="var(--m-ink)" stroke-width="2.1" stroke-linecap="round"/>
    <path d="M53.5 36.2 C59.4 38.6, 60.2 47.4, 56 54.4 C54.8 56.2, 52.5 55.2, 52.9 53 C54.8 48, 54.4 42.6, 52.4 40 Z" fill="var(--m-surface)" stroke="var(--m-primary)" stroke-width="2.1" stroke-linejoin="round"/>
    <path d="M23.5 53.6 L32 61.2 L40.5 53.6 Z" fill="var(--m-card)" stroke="var(--m-primary)" stroke-width="2.2" stroke-linejoin="round"/>
    <path d="M28.8 55.4 L32 58.6 L35.2 55.4" fill="none" stroke="var(--m-primary)" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
