<!doctype html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Öğrenci yazdırma rehberi | İstanbul Topkapı Üniversitesi</title>
    <style>
        @font-face { font-family: Guide; src: url('{{latinFont}}') format('truetype'); font-weight: 100 900; }
        @font-face { font-family: GuideArabic; src: url('{{arabicFont}}') format('truetype'); font-weight: 100 900; }
        @page { size: A4; margin: 0; }
        * { box-sizing: border-box; }
        body { margin: 0; color: #20242b; background: #edf0f3; font-family: Guide, sans-serif; }
        .sheet { width: 210mm; min-height: 297mm; padding: 8mm 10mm; margin: 0 auto; background: #fff; }
        header { display: flex; align-items: center; justify-content: space-between; padding-bottom: 3mm; border-bottom: .5mm solid #861b3a; }
        header img { width: 58mm; height: 18mm; object-fit: contain; }
        .office { text-align: right; font-size: 8.4pt; line-height: 1.5; color: #5b6471; }
        .office strong { display: block; color: #861b3a; font-size: 9pt; }
        .hero { display: grid; grid-template-columns: 1fr 62mm; gap: 8mm; align-items: center; padding: 3mm 0; }
        .eyebrow { margin: 0 0 2mm; color: #861b3a; font-size: 9pt; font-weight: 700; letter-spacing: .6pt; }
        h1 { margin: 0; font-size: 27pt; line-height: 1.2; letter-spacing: -.5pt; }
        .hero-en { margin: 2mm 0; font-size: 15pt; font-weight: 600; color: #515965; }
        .qr { text-align: center; }
        .qr svg { display: block; width: 62mm; height: 62mm; }
        .qr p { margin: 0; font-size: 8.3pt; font-weight: 700; color: #861b3a; }
        .address { margin: 0 0 4mm; padding: 2.2mm; text-align: center; background: #f6f3f4; font-size: 9pt; }
        .address a { color: #20242b; text-decoration: none; }
        .language-section { padding: 2mm 0; border-top: .25mm solid #dfe3e8; break-inside: avoid; }
        h2 { margin: 0 0 2mm; font-size: 11pt; line-height: 1.3; font-weight: 700; }
        h2 span { display: inline-block; margin-inline-end: 2mm; color: #861b3a; }
        ol { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 3mm; list-style: none; counter-reset: step; margin: 0; padding: 0; }
        li { counter-increment: step; position: relative; padding-inline-start: 5.5mm; font-size: 9.1pt; line-height: 1.45; }
        li::before { content: counter(step); position: absolute; inset-inline-start: 0; top: .3mm; width: 4.5mm; height: 4.5mm; border-radius: 50%; text-align: center; background: #861b3a; color: #fff; font-size: 8pt; line-height: 4.5mm; font-weight: 700; }
        .limits { margin: 1.4mm 0 0; font-size: 7.8pt; line-height: 1.35; color: #515965; }
        .limits { font-weight: 600; }
        .language-section[lang=ar] { font-family: GuideArabic, sans-serif; }
        .language-section[lang=ar] li { font-size: 10pt; line-height: 1.5; }
        footer { margin-top: 3mm; border-top: .5mm solid #861b3a; padding-top: 2mm; display: flex; justify-content: space-between; color: #515965; font-size: 7.8pt; }
        @media print { body { background: #fff; } .sheet { margin: 0; } }
    </style>
</head>
<body>
    <main class="sheet">
        <header>
            <img src="{{logo}}" alt="İstanbul Topkapı Üniversitesi">
            <div class="office"><strong>Uluslararası Öğrenci Ofisi</strong><span lang="en">International Student Office</span></div>
        </header>
        <div class="hero">
            <div>
                <p class="eyebrow">TELEFONUNDAN YAZDIR</p>
                <h1>Belgeni seç.<br>Yazdır. Çıktını al.</h1>
                <p class="hero-en" lang="en">Print from your phone</p>
            </div>
            <div class="qr">{{qrSvg}}<p>QR'ı okut / Scan QR</p></div>
        </div>
        <p class="address" dir="ltr"><a href="{{printUrl}}">{{printUrl}}</a></p>
        {{languages}}
        <footer><span>İstanbul Topkapı Üniversitesi</span><span>A4 · Uluslararası Öğrenci Ofisi</span></footer>
    </main>
</body>
</html>
