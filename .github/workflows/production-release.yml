name: Production release preflight (publication locked)

# Deliberately no push, workflow_run, schedule or deployment trigger.
on:
  workflow_dispatch:
    inputs:
      sha:
        description: Full reviewed production HEAD SHA to validate (does not deploy)
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  candidate:
    name: Verify explicit production SHA
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.candidate.outputs.sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Bind review and checkout to the same SHA
        id: candidate
        env:
          RELEASE_SHA: ${{ inputs.sha }}
        run: |
          node scripts/ci/check-release-sha.mjs
          echo "sha=$RELEASE_SHA" >> "$GITHUB_OUTPUT"
  validate:
    name: Validate exact candidate
    needs: candidate
    uses: ./.github/workflows/ci.yml
    with:
      sha: ${{ needs.candidate.outputs.sha }}
    # No secrets: inherit. Validation has no production environment or credentials.
  preflight-locked:
    name: Approved identity and release preflight (publication remains locked)
    needs: [candidate, validate]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: Production
    permissions:
      contents: read
      actions: read # Download signed metadata only; no backup contents.
    env:
      RELEASE_SHA: ${{ needs.candidate.outputs.sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.candidate.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.19.0'
      - name: Install locked deployment tooling
        run: |
          npm install --global npm@11.9.0
          npm ci --ignore-scripts
      - name: Confirm production HEAD still matches the reviewed SHA
        run: |
          git fetch --no-tags origin production
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          test "$(git rev-parse refs/remotes/origin/production)" = "$RELEASE_SHA"
      - name: Download artifact produced by exact-SHA CI
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/candidate-release
      - name: Verify artifact contents and source SHA
        env:
          ARTIFACT_ROOT: ${{ runner.temp }}/candidate-release
        run: |
          test "$(cat "$ARTIFACT_ROOT/candidate-sha.txt")" = "$RELEASE_SHA"
          node scripts/ci/candidate-artifact.mjs verify "$RELEASE_SHA" "$ARTIFACT_ROOT"
          sha256sum --check "$ARTIFACT_ROOT/candidate-config.sha256"
      - name: Verify Cloudflare token, account, Worker bindings, runtime secrets and cron
        id: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/ci/cloudflare-preflight.mjs
      - name: Check remote D1 migration ledger without applying migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/ci/check-migration-ledger.mjs
      - name: Select latest successful maintenance metadata (fail closed)
        id: recovery
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/recovery/maintenance-run.mjs
      - name: Download signed metadata only from maintenance
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: recovery-evidence
          run-id: ${{ steps.recovery.outputs.run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/recovery-metadata
      - name: Check backup health and periodic restore evidence (no backup or restore execution)
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          RECOVERY_RUN_ID: ${{ steps.recovery.outputs.run_id }}
        run: node scripts/ci/check-backup-evidence.mjs "$RUNNER_TEMP/recovery-metadata/production-evidence.json"
      - name: Require rollback compatibility evidence for schema, secrets, bindings and cron
        env:
          RECOVERY_RUN_ID: ${{ steps.recovery.outputs.run_id }}
          CURRENT_WORKER_VERSION: ${{ steps.cloudflare.outputs.current_version }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/ci/check-rollback-evidence.mjs "$RUNNER_TEMP/recovery-metadata/production-evidence.json"
      - name: Check production deploy dry run and secret metadata guard
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          ARTIFACT_ROOT: ${{ runner.temp }}/candidate-release
        run: |
          node scripts/check-production-print-secrets.mjs
          node scripts/ci/artifact-dry-run.mjs
          node scripts/ci/candidate-artifact.mjs verify "$RELEASE_SHA" "$ARTIFACT_ROOT"
      - name: Keep publication locked until independent implementation and recovery review
        run: |
          echo '::error::Preflight complete. Publication remains locked until the exact-artifact deploy path and rollback compatibility gates receive a separate reviewed change.'
          exit 1
      - name: Prepared exact-artifact publication (unreachable while unconditional lock remains)
        if: success()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          ARTIFACT_ROOT: ${{ runner.temp }}/candidate-release
          CURRENT_WORKER_VERSION: ${{ steps.cloudflare.outputs.current_version }}
          RECOVERY_RUN_ID: ${{ steps.recovery.outputs.run_id }}
          RECOVERY_EVIDENCE_PATH: ${{ runner.temp }}/recovery-metadata/production-evidence.json
        run: node scripts/ci/exact-artifact-release.mjs
    # The step above is unreachable after exit 1 and has a second disabled code policy.
    # No remote migration, rollback, D1/R2 data write or secret-value command exists.
