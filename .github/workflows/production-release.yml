name: Production release (manual)

# Deliberately no push, workflow_run, schedule or deployment trigger.
on:
  workflow_dispatch:
    inputs:
      sha:
        description: Full reviewed production HEAD SHA
        type: string
        required: true
      operation:
        description: Preflight, publish the Worker, update triggers, or publish code and reviewed cron settings together
        type: choice
        options: [preflight, publish, cron-update, cron-release]
        default: preflight
        required: true

permissions:
  contents: read

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  candidate:
    name: Verify explicit production SHA
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.candidate.outputs.sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Bind review and checkout to the same SHA
        id: candidate
        env:
          RELEASE_SHA: ${{ inputs.sha }}
        run: |
          node scripts/ci/check-release-sha.mjs
          echo "sha=$RELEASE_SHA" >> "$GITHUB_OUTPUT"
  validate:
    name: Validate exact candidate
    needs: candidate
    uses: ./.github/workflows/ci.yml
    with:
      sha: ${{ needs.candidate.outputs.sha }}
    # No secrets: inherit. Validation has no production environment or credentials.
  release:
    name: Approved production preflight and optional publication
    needs: [candidate, validate]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: Production
    env:
      RELEASE_SHA: ${{ needs.candidate.outputs.sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.candidate.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.19.0'
      - name: Install locked deployment tooling
        run: |
          npm install --global npm@11.9.0
          npm ci --ignore-scripts
      - name: Confirm production HEAD still matches the reviewed SHA
        run: |
          git fetch --no-tags origin production
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          test "$(git rev-parse refs/remotes/origin/production)" = "$RELEASE_SHA"
      - name: Download artifact produced by exact-SHA CI
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/candidate-release
      - name: Verify artifact contents and source SHA
        env:
          ARTIFACT_ROOT: ${{ runner.temp }}/candidate-release
        run: |
          test "$(cat "$ARTIFACT_ROOT/candidate-sha.txt")" = "$RELEASE_SHA"
          node scripts/ci/candidate-artifact.mjs verify "$RELEASE_SHA" "$ARTIFACT_ROOT"
          sha256sum --check "$ARTIFACT_ROOT/candidate-config.sha256"
      - name: Enforce code-only release scope
        run: node scripts/ci/code-only-scope.mjs
      - name: Verify Cloudflare token, account, Worker bindings, runtime secrets and cron
        id: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          RELEASE_OPERATION: ${{ inputs.operation }}
        run: node scripts/ci/cloudflare-preflight.mjs
      - name: Check remote D1 migration ledger without applying migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/ci/check-migration-ledger.mjs
      - name: Check production deploy dry run and secret metadata guard
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          ARTIFACT_ROOT: ${{ runner.temp }}/candidate-release
        run: |
          node scripts/check-production-print-secrets.mjs
          node scripts/ci/artifact-dry-run.mjs
          node scripts/ci/candidate-artifact.mjs verify "$RELEASE_SHA" "$ARTIFACT_ROOT"
      - name: Publish exact tested artifact once and verify active version and health
        if: ${{ inputs.operation == 'publish' || inputs.operation == 'cron-release' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          ARTIFACT_ROOT: ${{ runner.temp }}/candidate-release
          CURRENT_WORKER_VERSION: ${{ steps.cloudflare.outputs.current_version }}
          RELEASE_OPERATION: ${{ inputs.operation }}
        run: node scripts/ci/exact-artifact-release.mjs
      - name: Update only reviewed production cron triggers
        if: ${{ inputs.operation == 'cron-update' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          RELEASE_OPERATION: ${{ inputs.operation }}
        run: node scripts/ci/update-production-crons.mjs
