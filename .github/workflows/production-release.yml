name: Production release rehearsal (publication locked)

# Deliberately no push, workflow_run, schedule or deployment trigger.
on:
  workflow_dispatch:
    inputs:
      sha:
        description: Full reviewed production HEAD SHA to validate (does not deploy)
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  candidate:
    name: Verify explicit production SHA
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.candidate.outputs.sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.19.0'
      - name: Bind review and checkout to the same SHA
        id: candidate
        env:
          RELEASE_SHA: ${{ inputs.sha }}
        run: |
          node scripts/ci/check-release-sha.mjs
          echo "sha=$RELEASE_SHA" >> "$GITHUB_OUTPUT"
  validate:
    name: Validate exact candidate
    needs: candidate
    uses: ./.github/workflows/ci.yml
    with:
      sha: ${{ needs.candidate.outputs.sha }}
    # No secrets: inherit. Validation has no production environment or credentials.
  publication-locked:
    name: Publication locked pending separate implementation review
    needs: [candidate, validate]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: Production
    env:
      RELEASE_SHA: ${{ needs.candidate.outputs.sha }}
    steps:
      - name: Fail closed even if environment approval is absent or misconfigured
        run: |
          echo "Validated candidate: $RELEASE_SHA"
          echo '::error::Publication is intentionally unavailable. Complete the reviewed authorization, backup, schema and rollback gates before adding any deploy operation.'
          exit 1
    # There is no Cloudflare credential reference or deploy/remote migration command.
    # Enabling publication requires a new reviewed code change, not a dispatch flag.
