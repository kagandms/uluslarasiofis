name: CI

on:
  pull_request:
    branches: [production]
  push:
    branches: [production]
  workflow_dispatch:
  workflow_call:
    inputs:
      sha:
        description: Exact candidate SHA for the manual release rehearsal
        type: string
        required: true

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      WRANGLER_SEND_METRICS: 'false'
      CLOUDFLARE_CF_FETCH_ENABLED: 'false'
      PYTHONDONTWRITEBYTECODE: '1'
      CLOUDFLARE_ENV: ''
    steps:
      - name: Checkout candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.sha || github.sha }}
          persist-credentials: false
      - name: Lint workflows with checksum-pinned actionlint
        run: |
          curl --fail --silent --show-error --location https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz --output "$RUNNER_TEMP/actionlint.tar.gz"
          echo "023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint"
      - name: Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.19.0'
      - name: Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.14'
      - name: Install locked Node dependencies
        run: |
          npm install --global npm@11.9.0
          npm ci --ignore-scripts
      - name: Audit all Node dependencies
        run: npm audit --audit-level=high
      - name: Full JavaScript regression suite (twice)
        run: |
          npm test
          npm test
      - name: Force and repeat native D1/R2 receipt race
        run: npm run test:receipt-stability -- 20
      - name: Install isolated Python test dependencies
        run: |
          python -m venv .ci-venv
          .ci-venv/bin/python -m pip install -r scripts/scanner/requirements.txt -r scripts/print_agent/requirements.txt
          .ci-venv/bin/python -m pip check
      - name: Scanner and Print Agent unit tests
        run: |
          .ci-venv/bin/python -m unittest discover -s test/scanner -p 'test*.py'
          .ci-venv/bin/python -m unittest discover -s scripts/print_agent -p 'test*.py'
      - name: Remove Python environment before isolated smoke copy
        run: rm -rf .ci-venv
      - name: Empty local D1 migrations and synthetic Worker smoke
        run: npm run ci:local
      - name: Build production candidate without credentials
        run: npm run build:production
      - name: Create immutable candidate artifact manifest
        env:
          EXPECTED_SHA: ${{ inputs.sha || github.sha }}
        run: node scripts/ci/candidate-artifact.mjs create "$EXPECTED_SHA"
      - name: Record tested source and configuration checksums
        env:
          EXPECTED_SHA: ${{ inputs.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git diff --exit-code
          git rev-parse HEAD > candidate-sha.txt
          sha256sum package-lock.json wrangler.jsonc > candidate-config.sha256
      - name: Preserve credential-free candidate for review
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            dist/
            candidate-artifact.json
            candidate-sha.txt
            candidate-config.sha256
          retention-days: 7
          if-no-files-found: error
          include-hidden-files: true
      - name: Download uploaded candidate for round-trip verification
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/candidate-roundtrip
      - name: Verify actual uploaded artifact round trip
        env:
          EXPECTED_SHA: ${{ inputs.sha || github.sha }}
          ARTIFACT_ROOT: ${{ runner.temp }}/candidate-roundtrip
        run: |
          test "$(cat "$ARTIFACT_ROOT/candidate-sha.txt")" = "$EXPECTED_SHA"
          sha256sum --check "$ARTIFACT_ROOT/candidate-config.sha256"
          node scripts/ci/candidate-artifact.mjs verify "$EXPECTED_SHA" "$ARTIFACT_ROOT"
      - name: Rehearse exact downloaded artifact without rebuilding or credentials
        env:
          RELEASE_SHA: ${{ inputs.sha || github.sha }}
          ARTIFACT_ROOT: ${{ runner.temp }}/candidate-roundtrip
        run: node scripts/ci/artifact-dry-run.mjs
